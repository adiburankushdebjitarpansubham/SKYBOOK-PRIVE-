<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyBook Privé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#ffffff;--pa:#ffffff;--ink:#2b2110;--mut:#7d6b45;--ln:#eadfc0;--br:#b8902f;--brs:#faf3dc;--gd:linear-gradient(135deg,#f4dc8e,#d1ac4c 55%,#a8832a);--ok:#1b9a5f;--bad:#b3261e;--hf:"Instrument Serif",Georgia,serif;--bf:"Hanken Grotesk",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;background:#fffdf7;color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{border-top:5px solid var(--br);margin:0;min-height:100%;background:radial-gradient(900px 520px at 100% -5%,rgba(209,172,76,.22),transparent 60%),radial-gradient(800px 520px at -10% 40%,rgba(244,220,142,.28),transparent 62%),radial-gradient(900px 600px at 90% 105%,rgba(168,131,42,.16),transparent 60%),repeating-linear-gradient(45deg,rgba(184,144,47,.045) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(184,144,47,.045) 0 1px,transparent 1px 14px),linear-gradient(180deg,#fffdf7,#fbf4de 55%,#fffdf7) fixed;color:var(--ink);font:15px/1.55 var(--bf)}
header{max-width:760px;margin:0 auto;padding:18px 18px 6px;display:flex;justify-content:space-between;align-items:center}
.logo{font:italic 28px var(--hf);cursor:pointer}.logo span{color:var(--br)}
main{max-width:760px;margin:0 auto;padding:8px 18px 60px}
h1{font:400 clamp(44px,11vw,76px)/.95 var(--hf);margin:18px 0 22px;letter-spacing:-.01em}
h2{font:400 32px/1.1 var(--hf);margin:0 0 14px}h3{font:700 13px var(--bf);margin:18px 0 8px}
.prog{display:flex;gap:4px;margin:6px 0 4px}.prog i{flex:1;height:3px;border-radius:2px;background:var(--ln)}.prog i.d{background:var(--gd)}
.pl{font-size:12px;color:var(--mut);margin-bottom:16px}
.card{background:var(--pa);border:1px solid var(--ln);box-shadow:0 10px 30px -22px rgba(168,132,42,.6);border-radius:14px;padding:20px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px;font-weight:500}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--pa);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.btn{background:var(--gd);color:#2b2110;border:0;padding:14px 22px;border-radius:999px;font:700 14px var(--bf);cursor:pointer}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--br)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.route{display:flex;align-items:center;gap:10px;margin-bottom:16px}.route>div{flex:1}.route .ar{font-size:24px;color:var(--br);padding-top:18px}
.fl{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;cursor:pointer;transition:border-color .15s}.fl:hover{border-color:var(--br)}
.tm{font:400 34px var(--hf);display:flex;align-items:center;gap:10px}.tm small{font:500 12px var(--bf);color:var(--mut)}
.bar{height:1px;background:var(--ln);flex:1;min-width:30px;position:relative}.bar:after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--br)}
.pr{font:400 30px var(--hf);color:var(--br);text-align:right}.m{color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:13px;min-height:20px;margin:8px 0 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.fus{border:1px solid var(--br);border-radius:140px 140px 20px 20px;padding:54px 18px 20px;background:var(--brs);max-width:340px;margin:0 auto}
.seats{display:grid;grid-template-columns:repeat(3,1fr) 18px repeat(3,1fr);gap:7px}
.s{aspect-ratio:1;border-radius:8px 8px 4px 4px;border:1px solid var(--ln);background:var(--pa);color:var(--ink);font-size:11px;cursor:pointer}
.s.x{opacity:.45;cursor:not-allowed;background:var(--ln)}.s.on{background:var(--gd);border-color:var(--br);color:#2b2110;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;background:var(--brs);border-radius:999px;padding:4px;margin:6px 0 18px}.tabs button{flex:1 1 auto;border:0;background:none;padding:10px 6px;border-radius:999px;color:var(--mut);font:500 13px var(--bf);cursor:pointer}.tabs button.on{background:var(--gd);color:#2b2110;font-weight:700}
.qrw{text-align:center}.qrb{position:relative;width:224px;height:224px;margin:4px auto 14px;background:#fff;border-radius:16px;padding:18px;overflow:hidden}
.qrb svg{width:100%;height:100%;display:block}
.qrb:before,.qrb:after{content:"";position:absolute;width:34px;height:34px;border:3px solid var(--br);z-index:2}
.qrb:before{left:6px;top:6px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.qrb:after{right:6px;bottom:6px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.laser{position:absolute;left:10px;right:10px;height:3px;background:linear-gradient(90deg,transparent,var(--ok),transparent);box-shadow:0 0 14px 3px rgba(27,154,95,.55);animation:sc 2.2s ease-in-out infinite alternate;z-index:3}
.qrb.hit .laser{animation:sc .9s linear forwards}.qrb.hit svg{transition:opacity .5s .6s;opacity:.15}
@keyframes sc{from{top:10px}to{top:208px}}
.wait{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}.wait i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pu 1.2s infinite}@keyframes pu{50%{opacity:.25;transform:scale(.7)}}
.done{text-align:center;padding:44px 12px}.tick{width:132px;height:132px;display:block;margin:0 auto 18px;overflow:visible}
.tc{fill:var(--ok);transform-origin:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.tr{fill:none;stroke:var(--ok);stroke-width:2;transform-origin:center;animation:ring 1.4s .35s ease-out 2 both}
.tp{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .5s .45s ease-out forwards}
.up{animation:up .5s .9s both}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
.bp{display:flex;flex-wrap:wrap;padding:0;overflow:hidden;border-radius:16px}.bpm{flex:3;min-width:250px;padding:20px}.bps{flex:1;min-width:150px;padding:20px;border-left:2px dashed var(--ln);text-align:center;background:var(--brs)}
.big{font:400 52px/1 var(--hf)}.rt{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.bars{display:flex;gap:2px;height:70px;justify-content:center;margin-bottom:8px}.bars i{background:var(--ink);display:block}
.ok{color:var(--ok);font-weight:700}
@media print{header,.prog,.pl,.np{display:none!important}body{background:#fff!important;color:#000}.card{break-inside:avoid}}
</style></head><body>
<header><div class="logo" onclick="go('search')">SkyBook <span>Privé</span></div><button class="btn o" style="padding:9px 16px;font-size:13px" onclick="go('mine')">My bookings</button></header>
<main id="app"></main>
<script>
const AP={DEL:["Delhi",28.56,77.1],BOM:["Mumbai",19.09,72.87],BLR:["Bengaluru",13.2,77.7],CCU:["Kolkata",22.65,88.45],HYD:["Hyderabad",17.24,78.43],MAA:["Chennai",12.99,80.17],GOI:["Goa",15.38,73.83],DXB:["Dubai",25.25,55.36],SIN:["Singapore",1.36,103.99],BKK:["Bangkok",13.69,100.75],LHR:["London",51.47,-0.45],JFK:["New York",40.64,-73.78]};
const AL=[["IndiGo","6E"],["Air India","AI"],["Vistara","UK"],["Akasa Air","QP"],["SpiceJet","SG"]];
const CL={"Economy Class":1,Business:2.8,"First Class":4.8,"Royal Suite":8};
let S={q:{from:"DEL",to:"BOM",date:"",pax:1,cls:""},f:null,p:[],seats:[],pm:"qr"};
const $=s=>document.getElementById(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function H(s){let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}
function R(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dist(a,b){const r=x=>x*Math.PI/180,[,la,lo]=AP[a],[,lb,lp]=AP[b];const d=Math.sin(r(lb-la)/2)**2+Math.cos(r(la))*Math.cos(r(lb))*Math.sin(r(lp-lo)/2)**2;return 12742*Math.asin(Math.sqrt(d))}
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN"),pad=n=>String(n).padStart(2,"0"),hm=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
function flights(q){const d=dist(q.from,q.to),dur=Math.round(d/780*60+35),rnd=R(H(q.from+q.to+q.date)),days=Math.max(0,(new Date(q.date)-new Date(new Date().toDateString()))/864e5),out=[];
for(let i=0;i<8;i++){const a=AL[Math.floor(rnd()*AL.length)],dep=Math.floor((5+rnd()*17)*60/5)*5,stops=d>3500&&rnd()>.5?1:0,du=dur+stops*95,pr=(1800+d*4.2)*(1+rnd()*.35)*(days<7?1.35:days>40?.85:1)*(a[1]=="UK"||a[1]=="AI"?1.12:1);
out.push({al:a[0],no:a[1]+" "+(100+Math.floor(rnd()*880)),dep,du,stops,arr:dep+du,base:pr,from:q.from,to:q.to,date:q.date,seed:H(q.from+q.to+q.date+i)})}
return out.sort((x,y)=>x.dep-y.dep)}
const fare=f=>f.base*CL[S.q.cls];
function save(b){try{const a=JSON.parse(localStorage.getItem("sb")||"[]");a.unshift(b);localStorage.setItem("sb",JSON.stringify(a))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("sb")||"[]")}catch(e){return[]}}
const SN=["Search","Flights","Travellers","Seats","Payment","Ticket"];
const steps=n=>`<div class="prog">${SN.map((_,i)=>`<i class="${i<=n?"d":""}"></i>`).join("")}</div><div class="pl">Step ${n+1} of 6 · ${SN[n]}</div>`;
function go(v){S.err="";V[v]();window.scrollTo(0,0)}
const V={
search(){const t=new Date(Date.now()+864e5*3).toISOString().slice(0,10),o=k=>Object.entries(AP).map(([c,a])=>`<option value="${c}" ${S.q[k]==c?"selected":""}>${a[0]} (${c})</option>`).join("");
$("app").innerHTML=``+steps(0)+`<div class="card"><div class="route"><div><label>From</label><select id="f">${o("from")}</select></div><span class="ar">→</span><div><label>To</label><select id="t">${o("to")}</select></div></div><div class="g"><div><label>Date</label><input type="date" id="d" min="${new Date().toISOString().slice(0,10)}" value="${S.q.date||t}"></div><div><label>Travellers</label><select id="n">${[1,2,3,4,5,6].map(n=>`<option ${S.q.pax==n?"selected":""}>${n}</option>`).join("")}</select></div><div><label>Cabin</label><select id="c" onchange="clsChg(this)"><option value="">Select cabin</option>${Object.keys(CL).map(c=>`<option ${S.q.cls==c?"selected":""}>${c}</option>`).join("")}<option value="TRAIN">🚆 Budget? Take the train</option></select></div></div><p class="err" id="e"></p><div class="btns"><button class="btn" onclick="srch()">Search flights</button></div><p class="m" style="margin-bottom:0">Demo data: schedules and fares are simulated and no real tickets are issued.</p></div>`},
results(){const l=flights(S.q);S.list=l;$("app").innerHTML=steps(1)+`<h2>${AP[S.q.from][0]} to ${AP[S.q.to][0]}</h2><p class="m">${S.q.date} · ${S.q.pax} traveller(s) · ${S.q.cls}</p>`+l.map((f,i)=>`<div class="card fl" onclick="pick(${i})"><div class="tm">${hm(f.dep)}<span class="bar"></span>${hm(f.arr)}${f.arr>=1440?"<small>+1</small>":""}</div><div class="pr">${inr(fare(f))}</div><div class="m">${f.al} ${f.no} · ${Math.floor(f.du/60)}h ${f.du%60}m · ${f.stops?"1 stop":"Non-stop"}</div><div class="m" style="text-align:right">per person</div></div>`).join("")+`<button class="btn o" onclick="go('search')">Change search</button>`},
pax(){const n=S.q.pax;let h=steps(2)+`<div class="card"><h2>Who's flying?</h2>`;for(let i=0;i<n;i++){const p=S.p[i]||{};h+=`<h3>Traveller ${i+1}</h3><div class="g"><div><label>First name</label><input id="fn${i}" value="${esc(p.fn||"")}"></div><div><label>Last name</label><input id="ln${i}" value="${esc(p.ln||"")}"></div><div><label>Age</label><input id="ag${i}" type="number" min="0" max="120" value="${esc(p.ag||"")}"></div></div>`}
h+=`<h3>Contact</h3><div class="g"><div><label>Email</label><input id="em" type="email" value="${esc(S.em||"")}"></div><div><label>Mobile (10 digits)</label><input id="ph" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="${esc(S.ph||"")}" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,10)"></div></div><p class="err" id="e"></p><div class="btns"><button class="btn o" onclick="go('results')">Back</button><button class="btn" onclick="paxNext()">Choose seats</button></div></div>`;$("app").innerHTML=h},
seats(){const r=R(S.f.seed),tk=new Set(),L="ABCDEF";for(let i=0;i<60;i++)if(r()<.3)tk.add(i);let h=steps(3)+`<div class="card"><h2>Pick ${S.q.pax} seat${S.q.pax>1?"s":""}</h2><div class="fus"><div class="seats">`;
for(let row=1;row<=10;row++){for(let c=0;c<6;c++){if(c==3)h+="<div></div>";const id=row+L[c],t=tk.has((row-1)*6+c);h+=`<button class="s ${t?"x":""} ${S.seats.includes(id)?"on":""}" ${t?"disabled":""} aria-label="Seat ${id}" onclick="seat('${id}')">${id}</button>`}}
h+=`</div></div><p class="m" style="text-align:center">Selected: ${S.seats.join(", ")||"none"} (${S.seats.length}/${S.q.pax})</p><div class="btns"><button class="btn o" onclick="go('pax')">Back</button><button class="btn" ${S.seats.length==S.q.pax?"":"disabled"} onclick="go('pay')">Continue to payment</button></div></div>`;$("app").innerHTML=h},
pay(){const b=fare(S.f)*S.q.pax,tx=b*.12,tot=b+tx;S.tot=tot;const M=[["qr","Scan QR"],["gpay","Google Pay"],["paytm","Paytm"],["credit","Credit card"],["debit","Debit card"]];let pn;
if(S.pm=="qr")pn=`<div class="qrw"><div class="qrb" id="qb"><div class="laser"></div><div id="qr"></div></div><div class="wait" id="wt"><i></i>Waiting for your scan</div><p class="m">Scan with any UPI app (Google Pay, PhonePe, Paytm) and approve ${inr(tot)}.</p><div class="btns" style="justify-content:center"><button class="btn" id="sim" onclick="simScan()">I've scanned it · Simulate scan</button></div><p class="m" style="margin-bottom:0">Demo QR: it uses a placeholder payee, so a real payment cannot complete. A live site confirms payment through a gateway webhook.</p></div>`;
else if(S.pm=="gpay")pn=`<label>Google Pay UPI ID</label><input id="upi" placeholder="name@okaxis" autocomplete="off"><p class="m">You will approve the request in your Google Pay app (simulated).</p><p class="err" id="e"></p><button class="btn" onclick="doPay()">Pay ${inr(tot)}</button>`;
else if(S.pm=="paytm")pn=`<label>Paytm mobile number</label><input id="pph" type="tel" inputmode="numeric" maxlength="10" value="${esc(S.ph||"")}" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,10)"><p class="m">A payment request will be sent to your Paytm app (simulated).</p><p class="err" id="e"></p><button class="btn" onclick="doPay()">Pay ${inr(tot)}</button>`;
else pn=`<div class="g"><div style="grid-column:1/-1"><label>${S.pm=="credit"?"Credit":"Debit"} card number</label><input id="cn" inputmode="numeric" placeholder="4111 1111 1111 1111" maxlength="19" autocomplete="off" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim()"></div><div><label>Name on card</label><input id="cname" autocomplete="off"></div><div><label>Expiry (MM/YY)</label><input id="ce" inputmode="numeric" maxlength="5" placeholder="MM/YY" oninput="let v=this.value.replace(/\\D/g,'').slice(0,4);this.value=v.length>2?v.slice(0,2)+'/'+v.slice(2):v"></div><div><label>CVV</label><input id="cv" type="password" inputmode="numeric" maxlength="3" autocomplete="off" oninput="this.value=this.value.replace(/\\D/g,'')"></div></div><p class="m">Demo card: 4111 1111 1111 1111, any future expiry, any CVV.</p><p class="err" id="e"></p><button class="btn" onclick="doPay()">Pay ${inr(tot)}</button>`;
$("app").innerHTML=steps(4)+`<div class="card"><h2>Review and pay</h2><div class="row"><span>${S.f.al} ${S.f.no} · ${S.f.from} → ${S.f.to}</span><span>${hm(S.f.dep)}</span></div><div class="row"><span>Fare × ${S.q.pax}</span><span>${inr(b)}</span></div><div class="row"><span>Taxes and fees (12%)</span><span>${inr(tx)}</span></div><div class="row"><b>Total</b><b>${inr(tot)}</b></div></div><div class="card"><div class="tabs">${M.map(([k,l])=>`<button class="${S.pm==k?"on":""}" onclick="S.pm='${k}';V.pay()">${l}</button>`).join("")}</div>${pn}<div class="btns"><button class="btn o" onclick="go('seats')">Back</button></div></div>`;
if(S.pm=="qr"){const u=`upi://pay?pa=skybook@demo&pn=${encodeURIComponent("SkyBook Prive")}&am=${tot.toFixed(2)}&cu=INR&tn=${encodeURIComponent(S.f.no+" "+S.f.date)}`;try{const q=qrcode(0,"M");q.addData(u);q.make();$("qr").innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){$("qr").textContent="QR unavailable"}}},
ticket(b){b=b||S.last;$("app").innerHTML=steps(5)+`<p class="ok np">Booking confirmed. Your boarding pass is ready.</p><div class="btns np" style="margin:0 0 16px"><button class="btn o" onclick="window.print()">Print bill &amp; ticket</button><button class="btn" id="eb" onclick="emailPass()">Email boarding pass</button><button class="btn o" onclick="go('search')">New search</button></div><p class="m np" id="es">Confirmation and boarding pass image will go to <b>${esc(b.em)}</b>.</p>${bill(b)}${bp(b)}`},
mine(){const a=load();$("app").innerHTML=`<h2>My bookings</h2>`+(a.length?a.map(tk).join(""):`<div class="card m">No bookings yet.</div>`)+`<button class="btn" onclick="go('search')">Book a flight</button>`}};
function bill(b){const sub=b.tot/1.12,tx=b.tot-sub,pn=b.p.length;return`<div class="card"><div class="row"><div><div class="m">Tax invoice · SkyBook Privé</div><div class="tm" style="font-size:28px">Bill ${esc(b.ref)}</div></div><div class="ok">Paid</div></div><div class="row"><span>Billed to</span><span>${esc(b.p[0].fn)} ${esc(b.p[0].ln)} · ${esc(b.em)}</span></div><div class="row"><span>Issued on</span><span>${new Date().toLocaleString("en-IN")}</span></div><div class="row"><span>${esc(b.al)} ${esc(b.no)} · ${b.from} → ${b.to} · ${esc(b.date)}</span><span>${esc(b.cls)}</span></div>${b.p.map((p,i)=>`<div class="row"><span>${esc(p.fn)} ${esc(p.ln)} · Seat ${esc(b.seats[i])}</span><span>${inr(sub/pn)}</span></div>`).join("")}<div class="row"><span>Fare subtotal</span><span>${inr(sub)}</span></div><div class="row"><span>Taxes and fees (12%)</span><span>${inr(tx)}</span></div><div class="row"><b>Total paid</b><b>${inr(b.tot)}</b></div><div class="row"><span>Payment method</span><span>${esc(b.pm||"-")}</span></div><p class="m" style="margin:10px 0 0">Demo bill: no real payment or ticket.</p></div>`}
function bp(b){return b.p.map((p,i)=>{const h=H(b.ref+i),gate="ABCD"[h%4]+(1+h%24),bars=Array.from({length:44},(_,k)=>`<i style="width:${1+((h>>(k%20))&3)}px"></i>`).join("");return`<div class="card bp"><div class="bpm"><div class="m">${esc(b.al)} · Boarding pass</div><div class="tm" style="font-size:28px">${esc(p.ln).toUpperCase()} / ${esc(p.fn).toUpperCase()}</div><div class="rt"><div><div class="big">${b.from}</div><div class="m">${AP[b.from][0]}</div></div><span class="bar" style="margin:0 14px"></span><div style="text-align:right"><div class="big">${b.to}</div><div class="m">${AP[b.to][0]}</div></div></div><div class="g"><div><div class="m">Flight</div><b>${esc(b.no)}</b></div><div><div class="m">Date</div><b>${esc(b.date)}</b></div><div><div class="m">Boarding</div><b>${hm(b.dep-45)}</b></div><div><div class="m">Gate</div><b>${gate}</b></div><div><div class="m">Seat</div><b>${esc(b.seats[i])}</b></div><div><div class="m">Cabin</div><b>${esc(b.cls)}</b></div></div></div><div class="bps"><div class="bars">${bars}</div><div class="m">${esc(b.ref)} · ${esc(b.seats[i])}</div></div></div>`}).join("")}
function tk(b){return`<div class="card"><div class="row"><div><div class="m">Booking reference</div><div class="tm">${esc(b.ref)}</div></div><div class="ok">Confirmed</div></div><div class="row"><span>${esc(b.al)} ${esc(b.no)}</span><span>${esc(b.date)}</span></div><div class="row"><span>${AP[b.from][0]} → ${AP[b.to][0]}</span><span>${hm(b.dep)} – ${hm(b.arr)}</span></div>${b.p.map((p,i)=>`<div class="row"><span>${esc(p.fn)} ${esc(p.ln)}</span><span>Seat ${esc(b.seats[i])}</span></div>`).join("")}<div class="row"><span>Paid via ${esc(b.pm||"-")}</span><b>${inr(b.tot)}</b></div></div>`}
function mailto(b){const L=["SKYBOOK E-TICKET","Reference: "+b.ref,"Flight: "+b.al+" "+b.no,AP[b.from][0]+" to "+AP[b.to][0]+", "+b.date,"Departs "+hm(b.dep),"Seats: "+b.seats.join(", "),"Paid (demo): "+inr(b.tot)].join("\n");return"mailto:"+encodeURIComponent(b.em).replace("%40","@")+"?subject="+encodeURIComponent("Your e-ticket "+b.ref)+"&body="+encodeURIComponent(L)}

function passBlob(b){return new Promise(res=>{const W=900,Hh=330,n=b.p.length,c=document.createElement("canvas");c.width=W;c.height=Hh*n;const x=c.getContext("2d"),F=(w,z,f)=>x.font=w+" "+z+"px "+(f||"'Hanken Grotesk',system-ui,sans-serif"),SF="'Instrument Serif',Georgia,serif";
b.p.forEach((p,i)=>{const y=i*Hh,h=H(b.ref+i),gate="ABCD"[h%4]+(1+h%24);x.fillStyle="#fff";x.fillRect(0,y,W,Hh);const g=x.createLinearGradient(0,y,W,y);g.addColorStop(0,"#f4dc8e");g.addColorStop(.55,"#d1ac4c");g.addColorStop(1,"#a8832a");x.fillStyle=g;x.fillRect(0,y,W,10);x.fillStyle="#faf3dc";x.fillRect(660,y+10,240,Hh-10);x.strokeStyle="#eadfc0";x.setLineDash([8,6]);x.lineWidth=2;x.beginPath();x.moveTo(660,y+10);x.lineTo(660,y+Hh);x.stroke();x.setLineDash([]);
x.fillStyle="#7d6b45";F("500",16);x.fillText(b.al+" · BOARDING PASS · SKYBOOK PRIVÉ",36,y+48);x.fillStyle="#2b2110";F("400",34,SF);x.fillText((p.ln+" / "+p.fn).toUpperCase(),36,y+92);
F("400",78,SF);x.fillText(b.from,36,y+178);x.textAlign="right";x.fillText(b.to,620,y+178);x.textAlign="left";x.fillStyle="#b8902f";x.fillRect(200,y+158,260,2);x.beginPath();x.arc(460,y+159,5,0,7);x.fill();
x.fillStyle="#7d6b45";F("500",15);x.fillText(AP[b.from][0],36,y+204);x.textAlign="right";x.fillText(AP[b.to][0],620,y+204);x.textAlign="left";
const it=[["FLIGHT",b.no],["DATE",b.date],["BOARDING",hm(b.dep-45)],["GATE",gate],["SEAT",b.seats[i]],["CABIN",b.cls]];it.forEach((t,k)=>{const cx=36+(k%3)*195,cy=y+246+Math.floor(k/3)*50;x.fillStyle="#7d6b45";F("500",13);x.fillText(t[0],cx,cy);x.fillStyle="#2b2110";F("700",19);x.fillText(String(t[1]),cx,cy+22)});
x.fillStyle="#2b2110";let bx=700;for(let k=0;k<44&&bx<870;k++){const w=1+((h>>(k%20))&3);x.fillRect(bx,y+60,w,100);bx+=w+2}
x.textAlign="center";x.fillStyle="#7d6b45";F("500",14);x.fillText(b.ref+" · "+b.seats[i],780,y+190);x.fillText("Demo ticket",780,y+Hh-30);x.textAlign="left"});
c.toBlob(res,"image/png")})}
function mailBody(b){return["Hello "+b.p.map(p=>p.fn).join(" & ")+",","","Your booking is confirmed. Thank you for flying with SkyBook Privé.","","Booking reference: "+b.ref,"Flight: "+b.al+" "+b.no,AP[b.from][0]+" ("+b.from+") to "+AP[b.to][0]+" ("+b.to+")","Date: "+b.date+", departs "+hm(b.dep),"Passengers and seats: "+b.p.map((p,i)=>p.fn+" "+p.ln+" - "+b.seats[i]).join(", "),"Cabin: "+b.cls,"Total paid (demo): "+inr(b.tot),"","Your boarding pass image is attached.","","(Demo booking: no real ticket is issued.)"].join("\n")}
async function emailPass(){const b=S.last,st=$("es"),btn=$("eb");btn.disabled=true;st.textContent="Preparing your boarding pass image…";
try{const bl=await passBlob(b),name="BoardingPass_"+b.ref+".png",file=new File([bl],name,{type:"image/png"}),sub="Booking confirmed · "+b.ref;
if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:sub,text:"To: "+b.em+"\n\n"+mailBody(b)});st.innerHTML="Pick your <b>Mail</b> app and send it to <b>"+esc(b.em)+"</b>.";btn.disabled=false;return}catch(e){if(e&&e.name=="AbortError"){st.textContent="Cancelled. You can try again.";btn.disabled=false;return}}}
let saved=false;try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data:bl});saved=true}}catch(e){}
if(!saved){const u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
st.innerHTML="Boarding pass image saved. Your email app is opening with the confirmation to <b>"+esc(b.em)+"</b>: <b>attach "+esc(name)+"</b> and send.";
setTimeout(()=>{location.href="mailto:"+b.em+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(mailBody(b))},600)}
catch(e){st.textContent="Could not prepare the image. Use Print pass instead."}
btn.disabled=false}
function srch(){const q={from:$("f").value,to:$("t").value,date:$("d").value,pax:+$("n").value,cls:$("c").value};if(q.from==q.to)return $("e").textContent="Origin and destination must differ.";if(!q.date)return $("e").textContent="Pick a date.";if(!q.cls||q.cls=="TRAIN"){$("e").textContent="Select a cabin to see flights, or take the train instead.";return train()}S.q=q;S.seats=[];go("results")}
function clsChg(el){if(el.value=="TRAIN"){el.value="";train()}}
function train(){const u="https://www.irctc.co.in/",old=$("tr");if(old)old.remove();const o=document.createElement("div");o.id="tr";o.className="np";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.style.cssText="position:fixed;inset:0;background:rgba(30,22,6,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60";
o.innerHTML=`<div class="card" style="max-width:420px;width:100%;margin:0;text-align:center"><div style="font-size:52px;line-height:1">🚆</div><h2 style="margin-top:10px">Plane mein nahi, train aapke liye better hai!</h2><p class="m">No cabin selected? Indian Railways has great-value fares. Opening the official IRCTC website in <b id="tc">5</b>s.</p><div class="btns" style="justify-content:center"><a class="btn" style="text-decoration:none" target="_blank" rel="noopener noreferrer" href="${u}">Go to IRCTC now</a><button class="btn o" id="ts">Stay on SkyBook</button></div></div>`;
document.body.appendChild(o);let n=5;const t=setInterval(()=>{n--;const e=$("tc");if(!e||!document.body.contains(o))return clearInterval(t);e.textContent=n;if(n<=0){clearInterval(t);try{window.open(u,"_blank","noopener,noreferrer")}catch(x){}e.parentNode.innerHTML="If a new tab did not open, tap <b>Go to IRCTC now</b>."}},1000);
$("ts").onclick=()=>{clearInterval(t);o.remove();const c=$("c");if(c)c.focus()};$("ts").focus()}
function pick(i){S.f=S.list[i];S.seats=[];go("pax")}
function paxNext(){const p=[];for(let i=0;i<S.q.pax;i++){const fn=$("fn"+i).value.trim(),ln=$("ln"+i).value.trim(),ag=$("ag"+i).value;if(!/^[A-Za-z .'-]{2,}$/.test(fn)||!/^[A-Za-z .'-]+$/.test(ln)||ag===""||ag<0)return $("e").textContent="Check name and age for traveller "+(i+1)+".";p.push({fn,ln,ag})}
const em=$("em").value.trim(),ph=$("ph").value.trim();if(!/^\S+@\S+\.\S+$/.test(em))return $("e").textContent="Enter a valid email.";if(!/^\d{10}$/.test(ph))return $("e").textContent="Mobile number must be exactly 10 digits.";S.p=p;S.em=em;S.ph=ph;go("seats")}
function seat(id){const i=S.seats.indexOf(id);if(i>=0)S.seats.splice(i,1);else if(S.seats.length<S.q.pax)S.seats.push(id);V.seats()}
function luhn(n){let t=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}t+=x;d=!d}return t%10==0}
function simScan(){$("sim").disabled=true;$("qb").classList.add("hit");$("wt").innerHTML="<i></i>Scan detected, confirming…";S.pmLabel="UPI QR";setTimeout(showOk,1500)}
function doPay(){const E=t=>{$("e").textContent=t};E("");
if(S.pm=="gpay"){const u=$("upi").value.trim();if(!/^[\w.\-]{2,}@[A-Za-z]{2,}$/.test(u))return E("Enter a valid UPI ID, for example name@okaxis.");S.pmLabel="Google Pay ("+u+")"}
else if(S.pm=="paytm"){if(!/^\d{10}$/.test($("pph").value))return E("Enter the 10-digit Paytm mobile number.");S.pmLabel="Paytm"}
else{const n=$("cn").value.replace(/\s/g,""),e=$("ce").value.match(/^(0[1-9]|1[0-2])\/(\d{2})$/);if(!/^\d{16}$/.test(n)||!luhn(n))return E("Enter a valid 16-digit card number.");if(!/^[A-Za-z .'-]{2,}$/.test($("cname").value.trim()))return E("Enter the name on the card.");if(!e)return E("Enter expiry as MM/YY.");const d=new Date(),y=2000+ +e[2];if(y<d.getFullYear()||(y==d.getFullYear()&&+e[1]<d.getMonth()+1))return E("This card has expired.");if(!/^\d{3}$/.test($("cv").value))return E("Enter the 3-digit CVV.");S.pmLabel=(S.pm=="credit"?"Credit":"Debit")+" card ••••"+n.slice(-4)}
setTimeout(showOk,900)}
function fin(){if(S.fd)return;S.fd=true;book()}
function showOk(){S.fd=false;$("app").innerHTML=steps(4)+`<div class="card done"><svg class="tick" viewBox="0 0 52 52" aria-hidden="true"><circle class="tr" cx="26" cy="26" r="25"/><circle class="tc" cx="26" cy="26" r="25"/><path class="tp" d="M15 27l8 8 15-17"/></svg><h2 class="up" role="status">Payment done</h2><p class="m up">${inr(S.tot)} paid via ${esc(S.pmLabel)}. Preparing your boarding pass…</p><button class="btn up" onclick="fin()">View boarding pass</button></div>`;window.scrollTo(0,0);setTimeout(fin,3000)}
function book(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let ref="";for(let i=0;i<6;i++)ref+=c[Math.floor(Math.random()*c.length)];const b={...S.f,ref,p:S.p,seats:[...S.seats],em:S.em,cls:S.q.cls,tot:S.tot,pm:S.pmLabel};S.last=b;save(b);V.ticket(b);setTimeout(()=>{try{window.print()}catch(e){}},900)}
go("search");
</script></body></html>
